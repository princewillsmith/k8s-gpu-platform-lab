# Production-style lab cluster: 1 control plane, 1 CPU worker, 1 (simulated) GPU worker
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: gpu-prod
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
      - containerPort: 443
        hostPort: 8443
  - role: worker
    labels:
      node.platform.lab/pool: cpu
  - role: worker
    labels:
      node.platform.lab/pool: gpu
      gpu.nvidia.com/class: H100
