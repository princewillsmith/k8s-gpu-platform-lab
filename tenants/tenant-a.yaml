# Customer namespace: quota (incl. GPUs), default limits, read-only access for the customer's engineers
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-a
  labels: {tenant: "tenant-a"}
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: compute-quota, namespace: tenant-a}
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 1Gi
    limits.memory: 2Gi
    requests.nvidia.com/gpu: "4"
    pods: "20"
    persistentvolumeclaims: "4"
---
apiVersion: v1
kind: LimitRange
metadata: {name: defaults, namespace: tenant-a}
spec:
  limits:
    - type: Container
      default: {cpu: 200m, memory: 128Mi}
      defaultRequest: {cpu: 50m, memory: 64Mi}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: tenant-a-engineers-view, namespace: tenant-a}
subjects:
  - {kind: Group, name: tenant-a-engineers, apiGroup: rbac.authorization.k8s.io}
roleRef: {kind: ClusterRole, name: view, apiGroup: rbac.authorization.k8s.io}
